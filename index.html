<!DOCTYPE html>
<html>
<head>
    <title>For My Husband</title>
    <style>
        body {
            background-color: #ffe4e1;
            background-image: url('https://www.transparenttextures.com/patterns/hearts.png');
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
            margin: 0;
        }

        .container { text-align: center; z-index: 2; position: relative; }
        
        .main-img {
            width: 250px; 
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1 { color: #d02090; margin-bottom: 20px; text-shadow: 2px 2px white; }

        .buttons { display: flex; gap: 20px; justify-content: center; align-items: center; }

        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: transform 0.2s ease;
            font-weight: bold;
        }

        #yesBtn { background-color: #ff69b4; color: white; }
        #noBtn { background-color: #bdc3c7; color: white; }

        /* Falling Hearts Animation */
        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            top: -10%; /* Start above the screen */
            animation: fall linear forwards; 
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } /* Fall past the bottom */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="valentine.jpg" alt="Us" class="main-img">
        <h1>Will you be my valentine?</h1>
        <div class="buttons">
            <button id="yesBtn" onmouseover="grow()" onmouseout="reset()">Yes</button>
            <button id="noBtn" onmouseover="shrink()" onmouseout="reset()">No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        function grow() { yesBtn.style.transform = "scale(1.6)"; }
        function shrink() { noBtn.style.transform = "scale(0.4)"; }
        function reset() { 
            yesBtn.style.transform = "scale(1)"; 
            noBtn.style.transform = "scale(1)";
        }

        yesBtn.onclick = () => alert("Yay! I love you! ❤️ I am outside of your building waiting for you... Let's have dinner together in NYC!");

        // Creating the falling hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's'; // 2-5 seconds
            // Randomly pick a size for variety
            heart.style.fontSize = Math.random() * 20 + 10 + 'px'; 
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 5000);
        }

        setInterval(createHeart, 200); // Hearts drop every 0.2 seconds
    </script>
</body>
</html>
